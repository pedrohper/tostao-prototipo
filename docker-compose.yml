services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tostao
      POSTGRES_PASSWORD: tostao
      POSTGRES_DB: tostao
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # só acessível de dentro da máquina; DB_PORT=5433 se a 5432 estiver ocupada
    volumes:
      - tostao-db:/var/lib/postgresql/data
volumes:
  tostao-db:
