services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tostao
      POSTGRES_PASSWORD: tostao
      POSTGRES_DB: tostao
    ports:
      - "127.0.0.1:5432:5432" # só acessível de dentro do servidor
    volumes:
      - tostao-db:/var/lib/postgresql/data
volumes:
  tostao-db:
